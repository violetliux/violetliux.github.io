<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Art of the Everyday · Violet Li</title>
<meta name="description" content="The Art of the Everyday: a campaign concept by Violet Li.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Tokens copied from the Violet Li design system in /index.html (v1.0). */
:root{
  color-scheme:light;
  --japanese-violet:#502F4C; --english-violet:#563C5C; --lavender-gray:#C8B8DB; --lavender-blush:#F5EAEC;
  --paper:#FBF7F5; --ink:#1C1219; --muted:#6B5B68; --line:#E5D8DD; --white:#FFFFFF;
  --f-sans:"DM Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-accent:"Instrument Serif","Times New Roman",Georgia,serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --t-h1:clamp(2.25rem,4.6vw,3.75rem); --t-body-l:1.1875rem; --t-body:1.0625rem; --t-small:.9375rem; --t-caption:.8125rem; --t-label:.75rem;
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px; --sp-9:96px;
  --r-md:12px; --r-pill:999px;
  --shadow-paper:0 1px 0 rgba(80,47,76,.06),0 14px 28px -16px rgba(80,47,76,.45);
  --gutter-l:max(clamp(32px,3.4vw,48px),env(safe-area-inset-left,0px));
  --gutter-r:max(clamp(32px,3.4vw,48px),env(safe-area-inset-right,0px));
  --read:960px; --text:660px;
}
@media (max-width:620px){:root{--gutter-l:max(16px,env(safe-area-inset-left,0px));--gutter-r:max(16px,env(safe-area-inset-right,0px))}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:var(--t-body);line-height:1.65;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
:focus-visible{outline:2px solid var(--japanese-violet);outline-offset:3px;border-radius:4px}
h1{font-family:var(--f-sans);font-size:var(--t-h1);line-height:1.05;text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.03em}
h1 em{font-family:var(--f-accent);font-style:italic;font-weight:400;letter-spacing:-.01em}
p{margin:0}
img{max-width:100%;height:auto;display:block}
.label{font-size:var(--t-label);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:var(--t-caption)}
.btn{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:44px;padding:0 22px;border-radius:var(--r-pill);font:500 var(--t-small)/1 var(--f-sans);text-decoration:none;border:1px solid var(--japanese-violet);background:var(--japanese-violet);color:var(--lavender-blush)}
.btn:hover{background:var(--english-violet)}
.btn svg{width:16px;height:16px}
.wrap{max-width:var(--read);margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
header{padding-block:var(--sp-9) var(--sp-7);text-align:center;display:grid;justify-items:center;gap:var(--sp-4)}
header .lede{max-width:var(--text);color:var(--muted);font-size:var(--t-body-l)}
header .btn{margin-top:var(--sp-3)}
.pages{display:grid;gap:var(--sp-7);padding-bottom:var(--sp-9)}
.page{margin:0;display:grid;gap:var(--sp-3);justify-items:center}
.page img{width:100%;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow-paper)}
.page figcaption{color:var(--muted)}
@media (max-width:620px){header{padding-block:var(--sp-8) var(--sp-6)}.pages{gap:var(--sp-6);padding-bottom:var(--sp-8)}}
</style>
</head>
<body>
<main>
  <header class="wrap">
    <p class="label">Campaign concept · 2027</p>
    <h1>The Art of the <em>Everyday</em></h1>
    <p class="lede">A campaign concept for my URBN 2027 internship application, not affiliated with Anthropologie.</p>
    <a class="btn" href="art-of-the-everyday.pdf" download>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M2.5 13.5h11"/></svg>
      Download PDF <span class="mono" style="opacity:.75">(15 MB)</span>
    </a>
  </header>
  <section class="wrap pages" aria-label="Concept pages">
    <figure class="page"><img src="page-01.webp" width="1600" height="2071" alt="Cover: “The Art of the Everyday” in serif type beside an arched photo of a sunlit window and a coffee cup, with a terracotta sun and botanical line drawing. Subtitle: a little beauty in the moments that make life yours. Credited to Xinpeng (Violet) Li, 2027, as an independent concept not affiliated with Anthropologie." fetchpriority="high"><figcaption class="mono">01 / 12</figcaption></figure>
    <figure class="page"><img src="page-02.webp" width="1600" height="2071" alt="“Finding beauty in the familiar”: a sage panel with an oval photo of a woman holding flowers and the words Discover, Express, Explore, next to the brand insight, creative opportunity and campaign objective." loading="lazy" decoding="async"><figcaption class="mono">02 / 12</figcaption></figure>
    <figure class="page"><img src="page-03.webp" width="1600" height="2071" alt="“A visual language for everyday moments”: a short note on the hand-made magazine mood, above five arched colour swatches: Parchment #F2EBDF, Sage #8C9A7C, Terracotta #B4603F, Warm Sand #DDC8A9 and Espresso #3A2A21." loading="lazy" decoding="async"><figcaption class="mono">03 / 12</figcaption></figure>
    <figure class="page"><img src="page-04.webp" width="1600" height="2071" alt="Typography and motifs: Cormorant Garamond for headlines and DM Sans for body text, three stamp-framed motifs (botanical linework, paper textures, sun illustrations), and the design principle “Tell one story, and let it change shape for each channel.”" loading="lazy" decoding="async"><figcaption class="mono">04 / 12</figcaption></figure>
    <figure class="page"><img src="page-05.webp" width="1600" height="2071" alt="Website landing page, “Shop by moment, not just by department”: a desktop homepage mockup with the hero “Find beauty in the little things”, a botanical arch image and a row of moment-based story cards." loading="lazy" decoding="async"><figcaption class="mono">05 / 12</figcaption></figure>
    <figure class="page"><img src="page-06.webp" width="1600" height="2071" alt="Website morning rituals chapter, “Start with something beautiful”: a desktop category page for Morning rituals with filters, three product cards and a teaser band leading to the afternoon chapter." loading="lazy" decoding="async"><figcaption class="mono">06 / 12</figcaption></figure>
    <figure class="page"><img src="page-07.webp" width="1600" height="2071" alt="Mobile functionality: four phone screens showing the landing page, the Morning rituals chapter, product listings and a product page, with notes on how the hero button leads to three chapters and products scroll sideways on mobile." loading="lazy" decoding="async"><figcaption class="mono">07 / 12</figcaption></figure>
    <figure class="page"><img src="page-08.webp" width="1600" height="2071" alt="Email, “Bring the story to the inbox”: the subject line “A little beauty, every day”, preheader and body copy beside a full email mockup with a floral hero, “Make room for the little things” and a Discover the collection button." loading="lazy" decoding="async"><figcaption class="mono">08 / 12</figcaption></figure>
    <figure class="page"><img src="page-09.webp" width="1600" height="2071" alt="Instagram carousel: five square posts in terracotta, photo and sage tones (The Art of the Everyday; For mornings worth slowing down; For afternoons made your own; For evenings spent together; Every day is yours to make beautiful) with the social caption and #TheArtoftheEveryday." loading="lazy" decoding="async"><figcaption class="mono">09 / 12</figcaption></figure>
    <figure class="page"><img src="page-10.webp" width="1600" height="2071" alt="In-store experience, “From inspiration to a space you can step into”: a vintage store display with a campaign sign reading “Everyday moments, beautifully yours” and a concept QR code, plus notes on the activation concept and customer experience." loading="lazy" decoding="async"><figcaption class="mono">10 / 12</figcaption></figure>
    <figure class="page"><img src="page-11.webp" width="1600" height="2071" alt="“One story, told a little differently in each place”: three arched photos for Discover (social and email), Explore (website and mobile) and Experience (physical store), with notes on why the campaign fits Anthropologie and how it keeps the brand connected." loading="lazy" decoding="async"><figcaption class="mono">11 / 12</figcaption></figure>
    <figure class="page"><img src="page-12.webp" width="1600" height="2071" alt="Closing page on espresso brown with a sand-coloured sun: “Making the everyday extraordinary, one moment at a time.” Credit line for Xinpeng (Violet) Li, 2027, noting it is an independent concept for the URBN 2027 Digital Design Internship application, not official Anthropologie work, and that photos are from Unsplash." loading="lazy" decoding="async"><figcaption class="mono">12 / 12</figcaption></figure>
  </section>
</main>
</body>
</html>
